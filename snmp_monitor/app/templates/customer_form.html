{% extends "base.html" %}
{% block title %}Add Customer - SNMP Monitor{% endblock %}
{% block content %}
  <h1>Add Customer</h1>
  <form method="post" action="/customers/new" class="form">
    <label>Name
      <input type="text" name="name" required>
    </label>
    <label>Notes
      <textarea name="notes" rows="3"></textarea>
    </label>
    <button type="submit">Add Customer</button>
  </form>
{% endblock %}
